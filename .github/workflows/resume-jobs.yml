name: Resume saved jobs
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revisionpay-scheduler
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Advance durable jobs
        env:
          APP_URL: ${{ vars.REVISIONPAY_APP_URL }}
          CRON_SECRET: ${{ secrets.REVISIONPAY_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo 'Configure REVISIONPAY_APP_URL and REVISIONPAY_CRON_SECRET to enable scheduled jobs.'
            exit 1
          fi
          curl --fail --silent --show-error --max-time 65 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/internal/tick"
